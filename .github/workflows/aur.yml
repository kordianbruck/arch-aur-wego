name: AUR

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: aur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          source PKGBUILD
          pacman -Syu --noconfirm --needed namcap "${depends[@]}" "${makedepends[@]}"

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Check .SRCINFO is up to date
        run: |
          su builder -c 'makepkg --printsrcinfo' > /tmp/SRCINFO
          diff -u .SRCINFO /tmp/SRCINFO || {
            echo "::error::.SRCINFO is outdated, run: makepkg --printsrcinfo > .SRCINFO"
            exit 1
          }

      - name: Build package
        run: su builder -c 'makepkg --noconfirm --cleanbuild'

      - name: Lint
        run: namcap PKGBUILD *.pkg.tar.*

      - name: Smoke test
        run: |
          pacman -U --noconfirm ./*.pkg.tar.*
          wego --man >/dev/null

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'CFG'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          CFG

      - name: Push to AUR
        run: |
          AUR_DIR="$(mktemp -d)"
          git clone ssh://aur@aur.archlinux.org/wego.git "$AUR_DIR"

          COMMIT_MSG_FILE="$(mktemp)"
          git log -1 --format=%B > "$COMMIT_MSG_FILE"
          if [ ! -s "$COMMIT_MSG_FILE" ]; then
            echo "Update package" > "$COMMIT_MSG_FILE"
          fi

          AUTHOR_NAME="$(git log -1 --format='%an')"
          AUTHOR_EMAIL="$(git log -1 --format='%ae')"
          AUTHOR_NAME="${AUTHOR_NAME:-github-actions[bot]}"
          AUTHOR_EMAIL="${AUTHOR_EMAIL:-github-actions[bot]@users.noreply.github.com}"

          # Sync packaging files to AUR directory (excluding GitHub workflows, git metadata, and repo docs)
          find "$AUR_DIR" -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          mapfile -t files < <(git ls-files | grep -v -E '^(\.github/|\.gitignore$|README\.md$)')
          for file in "${files[@]}"; do
            if [[ "$file" == *"/"* ]]; then
              echo "::error::AUR packages cannot contain subdirectories: $file"
              exit 1
            fi
            cp "$file" "$AUR_DIR/"
          done

          cd "$AUR_DIR"

          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit to AUR."
            exit 0
          fi

          git commit -F "$COMMIT_MSG_FILE"
          git push origin master
