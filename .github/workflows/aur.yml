name: AUR

on:
  pull_request:
  push:
    branches: [master]
    # Release tags are named after the package version: <pkgver>-<pkgrel>, e.g. 2.4-1.
    tags: ['[0-9]*-[0-9]*']
  workflow_dispatch:

concurrency:
  group: aur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          source PKGBUILD
          pacman -Syu --noconfirm --needed namcap "${depends[@]}" "${makedepends[@]}"

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Check .SRCINFO is up to date
        run: |
          su builder -c 'makepkg --printsrcinfo' > /tmp/SRCINFO
          diff -u .SRCINFO /tmp/SRCINFO || {
            echo "::error::.SRCINFO is outdated, run: makepkg --printsrcinfo > .SRCINFO"
            exit 1
          }

      - name: Build package
        run: su builder -c 'makepkg --noconfirm --cleanbuild'

      - name: Lint
        run: namcap PKGBUILD *.pkg.tar.*

      - name: Smoke test
        run: |
          pacman -U --noconfirm ./*.pkg.tar.*
          wego --man >/dev/null

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          pkgver="$(awk -F' = ' '$1 ~ /^\tpkgver$/ {print $2}' .SRCINFO)"
          pkgrel="$(awk -F' = ' '$1 ~ /^\tpkgrel$/ {print $2}' .SRCINFO)"
          if [ "$tag" != "$pkgver-$pkgrel" ]; then
            echo "::error::Tag $tag does not match .SRCINFO version $pkgver-$pkgrel"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tag $tag does not point to a commit on master"
            exit 1
          fi

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        run: |
          : "${AUR_SSH_PRIVATE_KEY:?secret AUR_SSH_PRIVATE_KEY is not set}"
          install -dm700 ~/.ssh
          (umask 077; printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur)
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          # An annotated tag's message becomes the AUR commit message. Re-fetch the tag
          # because actions/checkout may have stored it as a lightweight tag.
          git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/msg"
          fi
          [ -s "$RUNNER_TEMP/msg" ] || echo "Update to $GITHUB_REF_NAME" > "$RUNNER_TEMP/msg"
          author="$(git log -1 --format='%an <%ae>')"

          git clone ssh://aur@aur.archlinux.org/wego.git aur
          git -C aur rm -rq --ignore-unmatch .
          # Files marked export-ignore in .gitattributes stay on GitHub only.
          git archive HEAD | tar -x -C aur

          cd aur
          git add -A
          git diff --cached --quiet && { echo "AUR already matches $GITHUB_REF_NAME"; exit 0; }
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit --author="$author" -F "$RUNNER_TEMP/msg"
          git push origin master
